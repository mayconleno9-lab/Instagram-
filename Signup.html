<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">



    <title>Faça seu cadastro - Sujeitogram</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!--AREA DO CONTEUDO-->

    <div id="wrapper">

   
        <div id="contaneir-signup">
            

            <!--AREA DIREITA-->

            <div class="column rigth">
                <div class="login-panel">
                    <div class="logo">
                        <img class="logo-img" src="assets/logo.png" alt="Logo do Sujeitogram">
                    </div>
                    <div class="message">
                        <span>Cadastre- se para ver fotos e vídeos dos seus amigos</span>
                    </div>

                    <button class="cta-button" >
                     Entrar com Facebook

                    </button>

                    <div class="divisor-contaneir">
                        <div class="line"></div>
                        <div class="divisor-tag"> ou</div>
                        <div class="line"></div>
                    </div>

                    <form>
                        <input placeholder="Número de celular ou email" type="text" name="email" />
                        <input placeholder="Nome completo" type="text" name="name" />
                        <input placeholder="Username" type="text" name="name" />
                        <input placeholder="senha" type="password" name="password" />

                        <input type="submit" value="Entrar" />
                    </form>
                </div>

                <div class="infobox">
                    <p>Tem uma conta? <a href="Index.html">Conecte-se</a> </p>
                </div>
                <div class="get-app-panel">
                    Obetenha o aplicativo.
                    <div class="app-buttons">
                        <a href="#">
                            <img src="assets/appstore.png" alt="Baixe na AppStore">
                        </a>

                        <a href="#">
                            <img src="assets/googleplay.png" alt="Baixe no Googleplay">
                        </a>

                    </div>
                </div>

            </div>
            <!--FIM AREA DIREITA-->

        </div>
        <!--FIM DO CONTEUDO-->

        <footer>
            <div class="footer-inner">
                <a href="#">About us </a>
                <a href="#">Support </a>
                <a href="#">Blog </a>
                <a href="#">Press</a>
                <a href="#">API</a>
                <a href="#">Jobs</a>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Directory</a>
                <a href="#">Profiles </a>
                <a href="#">hashtags</a>
                <a href="#">Language</a>
                <div class="text-small"> @ 2022 Instagram</div>

            </div>
        </footer>
    </div>


</body>

</html>
